# coturn en STUN SEUL pour SetRemote (WebRTC) : chaque appareil apprend son
# adresse publique pour établir le pair-à-pair. Aucun relais de trafic (TURN),
# aucune authentification, aucune donnée stockée.
listening-port=3478
stun-only
no-tls
no-rfc5780
fingerprint
# coturn 4.18 : DTLS, interface d'administration (CLI) et version du logiciel
# sont désactivés par défaut. Les avertissements « Certificate file not found »
# et « NO EXPLICIT … ADDRESS » au démarrage sont normaux ici (pas de TLS).
# Sortie standard, niveau normal (pas de « verbose ») : démarrage et
# configuration seulement, les requêtes STUN ne sont pas journalisées.
log-file=stdout
simple-log
pidfile=/var/tmp/turnserver.pid

# ── Activer TURN plus tard (relais du trafic quand le pair-à-pair échoue) ──
# 1. Supprimer la ligne « stun-only » ci-dessus, puis décommenter et adapter :
# use-auth-secret
# static-auth-secret=<secret aléatoire : openssl rand -hex 32 ; JAMAIS dans le dépôt>
# realm=relais.exemple.fr
# external-ip=<IPv4 publique du VPS>
# min-port=49160
# max-port=49200
# total-quota=50
# user-quota=4
# no-multicast-peers
# denied-peer-ip=0.0.0.0-0.255.255.255
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=100.64.0.0-100.127.255.255
# denied-peer-ip=127.0.0.0-127.255.255.255
# denied-peer-ip=169.254.0.0-169.254.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
# 2. Ouvrir en plus les ports UDP 49160 à 49200 (pare-feu OVH et ufw).
# 3. Côté app : identifiants TURN éphémères (HMAC-SHA1 du secret, valables
#    quelques heures, schéma « use-auth-secret ») délivrés par un petit service
#    à écrire ; le secret ne doit JAMAIS être embarqué dans l'app.
