# SetRemote : relais derrière un nginx DÉJÀ installé sur le VPS (port 443 occupé).
# 1. relay/deploy/.env : COMPOSE_PROFILES=stun (pas de Caddy), puis
#    « docker compose up -d --build » : le relais écoute sur 127.0.0.1:8080.
# 2. Certificat : sudo certbot certonly --nginx -d relais.exemple.fr
# 3. Copier ce fichier dans /etc/nginx/sites-available/setremote-relais.conf,
#    remplacer relais.exemple.fr, activer :
#      sudo ln -s ../sites-available/setremote-relais.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# Le relais fait confiance à X-Forwarded-For venant du réseau Docker
# RELAY_SUBNET (nginx sur l'hôte y arrive par la passerelle) : rien à changer.

# Si un autre site définit déjà $connection_upgrade, supprimer ce bloc « map »
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl; # supprimer cette ligne si le VPS n'a pas d'IPv6
    server_name relais.exemple.fr;

    ssl_certificate     /etc/letsencrypt/live/relais.exemple.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relais.exemple.fr/privkey.pem;

    # Aucun journal d'accès (IP + chemin = topic de session). Journal d'erreurs
    # au niveau « crit » : les erreurs de proxy ordinaires, qui contiennent
    # l'IP du client et la requête, ne sont pas écrites.
    access_log off;
    error_log /var/log/nginx/error.log crit;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Remplace (ne complète pas) l'en-tête : seule l'adresse vue par nginx passe
        proxy_set_header X-Forwarded-For $remote_addr;
        # Au-delà du battement du relais (25 s) : les sockets inactifs restent ouverts
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
